<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · mapa del cuerpo — NutriSlim</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=46">

<style>
/* ============================================================
   PROTOTIPO — el cuerpo como barra de progreso
   Página aparte, no toca el test que ya funciona. Cinco áreas
   de muestra en vez de diecisiete.
   ============================================================ */

body{ background:var(--overlay); color:var(--light); min-height:100vh; }
body::after{ opacity:.045; }

.p-bar{
  position:fixed; top:0; left:0; right:0; z-index:60;
  display:flex; align-items:center; gap:clamp(14px,3vw,32px);
  padding:16px var(--gut);
  background:linear-gradient(to bottom, rgba(var(--scrim-rgb),.9), transparent);
}
.p-bar__tag{ font-family:var(--font-mono); font-size:10px; letter-spacing:.2em; color:var(--sand); margin:0; }
.p-bar__count{ margin:0 0 0 auto; font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; color:var(--light-40); }

.p-wrap{
  min-height:100vh; display:grid; place-items:center;
  padding:clamp(90px,13vh,140px) var(--gut) clamp(48px,8vh,90px);
}
.p-screen{ display:none; width:100%; max-width:1060px; }
.p-screen.is-on{ display:block; }

/* ── elección de silueta ─────────────────────────────────── */
.p-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; color:var(--sand); margin:0 0 20px; }
.p-title{
  font-family:var(--font-display); font-weight:300;
  font-size:clamp(30px,4.6vw,56px); line-height:1.05;
  letter-spacing:-.025em; margin:0 0 14px;
}
.p-sub{ font-size:15.5px; color:var(--light-60); margin:0 0 clamp(32px,5vh,52px); max-width:52ch; }

.p-pick{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,2vw,22px); max-width:760px; }
.p-pick__b{
  display:flex; flex-direction:column; align-items:center; gap:16px;
  padding:26px 18px 20px; border-radius:var(--media-radius);
  border:1px solid var(--light-10); background:rgba(var(--paper-rgb),.03);
  color:var(--light-60); transition:border-color .4s var(--expoOut),
    background .4s var(--expoOut), color .4s var(--expoOut), transform .4s var(--expoOut);
}
.p-pick__b:hover{ border-color:var(--light-40); color:var(--light); transform:translateY(-3px); }
.p-pick__b.is-on{ border-color:var(--sand); color:var(--light); background:rgba(var(--paper-rgb),.07); }
.p-pick__b svg{ width:52px; height:112px; }
.p-pick__b span{ font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; text-align:center; line-height:1.5; }

/* ── pregunta + cuerpo ───────────────────────────────────── */
.p-grid{ display:grid; grid-template-columns:1fr 300px; gap:clamp(28px,5vw,72px); align-items:center; }

.p-area__n{ font-family:var(--font-mono); font-size:11px; letter-spacing:.22em; color:var(--tint,var(--sand)); margin:0 0 14px; }
.p-area__t{
  font-family:var(--font-display); font-weight:300;
  font-size:clamp(28px,4vw,46px); line-height:1.06;
  letter-spacing:-.02em; margin:0 0 clamp(24px,4vh,38px);
}
.p-chips{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:clamp(28px,4vh,44px); }
.p-chip{
  display:inline-flex; align-items:center; gap:9px;
  padding:12px 18px 12px 15px; border-radius:100px;
  border:1px solid var(--light-20); color:var(--light-60);
  font-size:14.5px; line-height:1.2;
  transition:border-color .35s var(--expoOut), color .35s var(--expoOut),
             background .35s var(--expoOut), transform .35s var(--expoOut);
}
.p-chip::before{
  content:""; flex:none; width:15px; height:15px; border-radius:50%;
  border:1px solid var(--light-40); transition:background .3s, box-shadow .3s;
}
.p-chip:hover{ border-color:var(--light-40); color:var(--light); }
.p-chip.is-on{
  color:var(--overlay); background:var(--tint,var(--sand));
  border-color:var(--tint,var(--sand)); transform:translateY(-1px);
}
.p-chip.is-on::before{ background:var(--overlay); border-color:var(--overlay); box-shadow:inset 0 0 0 3px var(--tint,var(--sand)); }

.p-nav{ display:flex; gap:10px; }
.p-next{ min-width:150px; justify-content:center; }

/* ── el cuerpo ───────────────────────────────────────────── */
.p-body{ justify-self:center; }
.p-body svg{ height:min(58vh,470px); width:auto; max-width:100%; overflow:visible; }

.b-base .b-line{
  fill:rgba(var(--paper-rgb),.045);
  stroke:rgba(var(--paper-rgb),.32);
  stroke-width:1.1; stroke-linejoin:round; stroke-linecap:round;
  transition:fill .8s var(--expoOut), stroke .8s var(--expoOut);
}
.b-base.is-skin .b-line{ stroke:rgba(var(--paper-rgb),.55); }

.b-zone{
  opacity:0;
  transition:opacity .9s var(--expoOut);
}
.b-zone.is-on{ opacity:var(--lvl,.7); }

/* el destello al completar un área: la respuesta inmediata */
@keyframes zonePop{
  0%{ transform:scale(.86); }
  55%{ transform:scale(1.14); }
  100%{ transform:scale(1); }
}
.b-zone.pop{ animation:zonePop .75s var(--expoOut); transform-origin:center; transform-box:fill-box; }

.b-ring{
  fill:none; stroke:var(--sand); stroke-width:1;
  opacity:0; transform-origin:center; transform-box:fill-box;
}
@keyframes ringOut{
  0%{ opacity:.8; transform:scale(.4); }
  100%{ opacity:0; transform:scale(1.9); }
}
.b-ring.pop{ animation:ringOut .9s var(--expoOut); }

.p-legend{
  margin:20px 0 0; text-align:center;
  font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.16em; color:var(--light-40);
}

/* ── resultado ───────────────────────────────────────────── */
.p-res{ display:grid; grid-template-columns:1fr 320px; gap:clamp(28px,5vw,72px); align-items:center; }
.p-score{ font-family:var(--font-display); font-weight:300; font-size:clamp(64px,9vw,120px); line-height:.85; letter-spacing:-.05em; color:var(--sand); }
.p-scoreL{ font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:var(--light-40); margin:12px 0 26px; }
.p-list{ display:flex; flex-direction:column; }
.p-row{ display:grid; grid-template-columns:40px 1fr 28px; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--light-10); }
.p-row__n{ font-family:var(--font-mono); font-size:11px; color:var(--light-40); }
.p-row__t{ font-size:14.5px; color:var(--light-60); }
.p-row__v{ font-family:var(--font-mono); font-size:11px; text-align:right; color:var(--tint,var(--sand)); }
.p-row--zero .p-row__t{ color:var(--light-20); }

@media (max-width:860px){
  .p-grid, .p-res{ grid-template-columns:1fr; }
  .p-body{ order:-1; }
  .p-body svg{ height:min(34vh,300px); width:auto; }
  .p-pick{ grid-template-columns:1fr; max-width:420px; }
  .p-pick__b{ flex-direction:row; justify-content:flex-start; gap:20px; padding:16px 20px; }
  .p-pick__b svg{ width:34px; height:74px; }
  .p-pick__b span{ text-align:left; }
}
</style>
</head>

<body>

<header class="p-bar">
  <p class="p-bar__tag">PROTOTIPO · MAPA DEL CUERPO</p>
  <p class="p-bar__count" id="pCount"></p>
</header>

<main class="p-wrap">

  <!-- ── 1 · qué silueta ────────────────────────────────── -->
  <section class="p-screen is-on" id="scPick">
    <p class="p-eyebrow">Antes de empezar</p>
    <h1 class="p-title">¿Qué cuerpo mapeamos?</h1>
    <p class="p-sub">Solo lo usamos para dibujar la silueta. No cambia ninguna pregunta y no se guarda en ningún lado.</p>

    <div class="p-pick" id="pick"></div>
  </section>

  <!-- ── 2 · preguntas ─────────────────────────────────── -->
  <section class="p-screen" id="scAsk">
    <div class="p-grid">
      <div>
        <p class="p-area__n" id="aNum">OO1</p>
        <h2 class="p-area__t" id="aTit"></h2>
        <div class="p-chips" id="aChips"></div>
        <div class="p-nav">
          <button class="btn" id="bBack">Atrás</button>
          <button class="btn btn--solid p-next" id="bNext">Siguiente</button>
        </div>
      </div>
      <div class="p-body">
        <div id="bodyHost"></div>
        <p class="p-legend" id="bodyLegend">TU MAPA SE VA DIBUJANDO</p>
      </div>
    </div>
  </section>

  <!-- ── 3 · resultado ─────────────────────────────────── -->
  <section class="p-screen" id="scRes">
    <div class="p-res">
      <div>
        <p class="p-eyebrow">Tu mapa</p>
        <div class="p-score" id="rNum">O</div>
        <p class="p-scoreL">SÍNTOMAS MARCADOS</p>
        <div class="p-list" id="rList"></div>
        <div style="margin-top:34px"><button class="btn" id="bAgain">Empezar de nuevo</button></div>
      </div>
      <div class="p-body">
        <div id="bodyHost2"></div>
        <p class="p-legend">DONDE SE CONCENTRA</p>
      </div>
    </div>
  </section>

</main>

<script>
(function(){
'use strict';

/* ════════════════════════════════════════════════════════════
   LA SILUETA
   Formas simples superpuestas: al ir rellenas se funden en un
   solo cuerpo. Los resplandores viven dentro de un recorte con
   esa misma forma, así nunca se salen del contorno.
   ════════════════════════════════════════════════════════════ */

function shapes(kind){
  /* Media silueta dibujada de un solo trazo: desde la coronilla, baja por
     el perfil izquierdo, rodea la mano, vuelve por la axila, sigue el
     costado, la pierna, el pie y sube por la cara interna hasta la ingle.
     Espejada da el cuerpo entero sin línea central.

     Tres medidas cambian según la silueta —hombro, cintura y cadera—
     y la curva se adapta sola. */
  var SH, WA, HI;                      /* menor x = más ancho */
  if (kind === 'f'){ SH = 58; WA = 78; HI = 58; }
  else if (kind === 'm'){ SH = 50; WA = 71; HI = 66; }
  else { SH = 54; WA = 75; HI = 62; }

  var d = 'M100 12'
    + 'C87 12 79 24 79 40'                          /* cráneo */
    + 'C79 53 86 63 91 67'                          /* mandíbula */
    + 'C91 71 91 74 89 78'                          /* cuello */
    + 'C86 84 78 86 70 90'                          /* trapecio */
    + 'C63 93 '+(SH+3)+' 99 '+SH+' 107'             /* hombro */
    + 'C'+(SH-3)+' 116 '+(SH-5)+' 128 '+(SH-6)+' 142'   /* brazo */
    + 'C'+(SH-7)+' 160 '+(SH-9)+' 180 '+(SH-10)+' 198'  /* antebrazo */
    + 'C'+(SH-11)+' 210 '+(SH-12)+' 222 '+(SH-12)+' 231'
    + 'C'+(SH-12)+' 238 '+(SH-8)+' 242 '+(SH-4)+' 239'  /* mano */
    + 'C'+(SH-1)+' 236 '+(SH+1)+' 229 '+(SH+2)+' 221'
    + 'C'+(SH+4)+' 204 '+(SH+6)+' 186 '+(SH+8)+' 170'   /* cara interna */
    + 'C'+(SH+10)+' 152 '+(SH+12)+' 134 '+(SH+14)+' 120'
    + 'C'+(SH+15)+' 116 '+(SH+16)+' 114 '+(SH+17)+' 112'/* axila */
    + 'C'+(WA-2)+' 130 '+(WA-1)+' 152 '+WA+' 172'       /* costado a cintura */
    + 'C'+(WA+1)+' 190 '+(HI+5)+' 202 '+(HI+5)+' 216'   /* cadera */
    + 'C'+(HI+2)+' 230 '+HI+' 248 '+HI+' 270'           /* muslo */
    + 'C'+HI+' 292 '+(HI+2)+' 310 '+(HI+3)+' 330'       /* rodilla */
    + 'C'+(HI+4)+' 352 '+(HI+6)+' 382 '+(HI+8)+' 410'   /* pantorrilla */
    + 'C'+(HI+8)+' 422 '+(HI+10)+' 430 '+(HI+16)+' 430' /* tobillo */
    + 'C86 430 94 430 96 428'                       /* pie */
    + 'C98 426 97 416 96 404'
    + 'C95 380 94 352 93 326'                       /* pierna, cara interna */
    + 'C92 300 94 274 97 252'
    + 'C98 246 99 242 100 238';                     /* ingle */

  return '<path class="b-line" d="'+d+'"/>'
       + '<path class="b-line" d="'+d+'" transform="translate(200 0) scale(-1 1)"/>';
}

/* Zonas: dónde se enciende cada área. r = radio del resplandor. */
var ZONES = {
  head:    [{x:100,y:44,r:29}],
  chest:   [{x:100,y:126,r:26}],
  abdomen: [{x:100,y:184,r:28}],
  joints:  [{x:57,y:104,r:20},{x:143,y:104,r:20},{x:84,y:330,r:20},{x:116,y:330,r:20}]
};

function bodySVG(kind, id){
  var sh = shapes(kind), grads = '', glows = '', rings = '';

  AREAS.forEach(function(a, ai){
    if (a.zone === 'skin' || !ZONES[a.zone]) return;
    var gid = 'g' + id + ai;
    grads += '<radialGradient id="'+gid+'">'
           +   '<stop offset="0"    stop-color="'+a.tint+'" stop-opacity=".95"/>'
           +   '<stop offset=".45"  stop-color="'+a.tint+'" stop-opacity=".55"/>'
           +   '<stop offset=".75"  stop-color="'+a.tint+'" stop-opacity=".18"/>'
           +   '<stop offset="1"    stop-color="'+a.tint+'" stop-opacity="0"/>'
           + '</radialGradient>';
    ZONES[a.zone].forEach(function(p){
      glows += '<circle class="b-zone" data-a="'+ai+'" cx="'+p.x+'" cy="'+p.y+'" r="'+(p.r*1.25)+'" fill="url(#'+gid+')"/>';
      rings += '<circle class="b-ring" data-a="'+ai+'" cx="'+p.x+'" cy="'+p.y+'" r="'+(p.r*0.75)+'" stroke="'+a.tint+'"/>';
    });
  });

  return '<svg viewBox="0 0 200 470" aria-hidden="true">'
    + '<defs>'+grads+'<clipPath id="clip'+id+'">'+sh+'</clipPath></defs>'
    + '<g class="b-base" data-base>'+sh+'</g>'
    + '<g clip-path="url(#clip'+id+')">'+glows+'</g>'
    + '<g>'+rings+'</g>'
    + '</svg>';
}

/* ════════════════════════════════════════════════════════════
   CINCO ÁREAS DE MUESTRA
   ════════════════════════════════════════════════════════════ */

var AREAS = [
  { n:'Tracto digestivo', zone:'abdomen', tint:'#A9C04F',
    items:['Sensación de hinchazón','Náuseas o vómitos','Dolor estomacal o cólicos','Acidez','Eructos','Flatulencias','Diarrea','Estreñimiento'] },
  { n:'Cabeza', zone:'head', tint:'#CDBBA0',
    items:['Dolores de cabeza','Mareos','Vértigo'] },
  { n:'Corazón', zone:'chest', tint:'#C98A85',
    items:['Latidos irregulares o salteados','Colesterol elevado','Dolor de pecho'] },
  { n:'Articulaciones y músculos', zone:'joints', tint:'#8FB3A8',
    items:['Dolor o molestia articular','Artrosis','Articulaciones hinchadas','Dolor creciente en las piernas'] },
  { n:'Piel', zone:'skin', tint:'#C4A6B4',
    items:['Acné','Comezón en la piel','Rubores o enrojecimientos'] }
];

var PICKS = [
  { k:'f', l:'FEMENINO' },
  { k:'m', l:'MASCULINO' },
  { k:'n', l:'PREFIERO<br>NO INDICARLO' }
];

/* ════════════════════════════════════════════════════════════ */

var $  = function(s,c){ return (c||document).querySelector(s); };
var $$ = function(s,c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); };

function hexA(hex, a){
  var n = parseInt(hex.slice(1), 16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(2)+')';
}

var kind   = 'n';
var picked = AREAS.map(function(){ return []; });
var step   = -1;

/* — elección de silueta — */
var pickBox = $('#pick');
PICKS.forEach(function(p){
  var b = document.createElement('button');
  b.className = 'p-pick__b';
  b.innerHTML = '<svg viewBox="0 0 200 470" aria-hidden="true"><g class="b-base">'+shapes(p.k)+'</g></svg><span>'+p.l+'</span>';
  b.addEventListener('click', function(){
    kind = p.k;
    $$('.p-pick__b').forEach(function(x){ x.classList.remove('is-on'); });
    b.classList.add('is-on');
    setTimeout(start, 260);
  });
  pickBox.appendChild(b);
});

function start(){
  $('#bodyHost').innerHTML  = bodySVG(kind, 'A');
  $('#bodyHost2').innerHTML = bodySVG(kind, 'B');
  go(0);
}

function show(id){
  $$('.p-screen').forEach(function(s){ s.classList.toggle('is-on', s.id === id); });
  window.scrollTo(0,0);
}

/* — pinta el cuerpo según lo marcado — */
function paintBody(host, upto, popZone){
  var svg = $('svg', host); if(!svg) return;
  var base = $('.b-base', svg);
  AREAS.forEach(function(a, i){
    if (upto !== undefined && i > upto) return;
    var n = picked[i].length, ratio = n / a.items.length;
    var lvl = n ? (0.30 + 0.55 * ratio) : 0;

    if (a.zone === 'skin'){            /* la piel tiñe todo el contorno */
      base.classList.toggle('is-skin', n > 0);
      $$('.b-line', base).forEach(function(pt){
        pt.style.stroke = n ? hexA(a.tint, 0.45 + ratio * 0.35) : '';
        pt.style.fill   = n ? hexA(a.tint, 0.05 + ratio * 0.07) : '';
      });
      return;
    }
    $$('.b-zone[data-a="'+i+'"]', svg).forEach(function(c){
      c.style.setProperty('--lvl', lvl.toFixed(2));
      c.classList.toggle('is-on', n > 0);
    });
    if (popZone === a.zone && n > 0){
      $$('.b-zone[data-a="'+i+'"], .b-ring[data-a="'+i+'"]', svg).forEach(function(el){
        el.classList.remove('pop'); void el.getBoundingClientRect(); el.classList.add('pop');
      });
    }
  });
}

/* — una pregunta — */
function render(i){
  var a = AREAS[i];
  $('#scAsk').style.setProperty('--tint', a.tint);
  $('#aNum').textContent = 'OO' + (i+1);
  $('#aTit').textContent = a.n;
  $('#pCount').textContent = 'OO' + (i+1) + ' / OO' + AREAS.length;

  var box = $('#aChips'); box.innerHTML = '';
  a.items.forEach(function(label, k){
    var b = document.createElement('button');
    b.className = 'p-chip' + (picked[i].indexOf(k) > -1 ? ' is-on' : '');
    b.textContent = label;
    b.addEventListener('click', function(){
      var at = picked[i].indexOf(k);
      if (at > -1) picked[i].splice(at,1); else picked[i].push(k);
      b.classList.toggle('is-on', at === -1);
      $('#bNext').textContent = picked[i].length
        ? (i === AREAS.length-1 ? 'Ver mi mapa' : 'Siguiente')
        : 'Nada de esto';
      paintBody($('#bodyHost'), i, a.zone);      /* respuesta inmediata */
    });
    box.appendChild(b);
  });

  $('#bNext').textContent = picked[i].length
    ? (i === AREAS.length-1 ? 'Ver mi mapa' : 'Siguiente')
    : 'Nada de esto';
  $('#bBack').style.visibility = i === 0 ? 'hidden' : 'visible';
  paintBody($('#bodyHost'), i);
}

function go(i){
  step = i;
  if (i >= AREAS.length) return finish();
  show('scAsk');
  render(i);
}

function finish(){
  show('scRes');
  $('#pCount').textContent = '';
  var total = picked.reduce(function(s,p){ return s+p.length; }, 0);
  $('#rNum').textContent = total;

  var rows = AREAS.map(function(a,i){ return { n:i+1, name:a.n, hit:picked[i].length, tint:a.tint }; })
                  .sort(function(x,y){ return y.hit - x.hit; });
  var list = $('#rList'); list.innerHTML = '';
  rows.forEach(function(r){
    var el = document.createElement('div');
    el.className = 'p-row' + (r.hit ? '' : ' p-row--zero');
    el.style.setProperty('--tint', r.tint);
    el.innerHTML = '<span class="p-row__n">OO'+r.n+'</span>'
                 + '<span class="p-row__t">'+r.name+'</span>'
                 + '<span class="p-row__v">'+(r.hit || '·')+'</span>';
    list.appendChild(el);
  });

  paintBody($('#bodyHost2'));
}

$('#bNext').addEventListener('click', function(){ go(step+1); });
$('#bBack').addEventListener('click', function(){ go(step-1); });
$('#bAgain').addEventListener('click', function(){
  picked = AREAS.map(function(){ return []; });
  step = -1; $('#pCount').textContent = '';
  $$('.p-pick__b').forEach(function(x){ x.classList.remove('is-on'); });
  show('scPick');
});
document.addEventListener('keydown', function(e){
  if (step < 0 || step >= AREAS.length) return;
  if (e.key === 'ArrowRight' || e.key === 'Enter') go(step+1);
  if (e.key === 'ArrowLeft' && step > 0) go(step-1);
});

})();
</script>
</body>
</html>
