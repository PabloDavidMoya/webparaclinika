<!-- ══════════════════════════════════════════ CURSOR -->
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor__dot"></div>
  <div class="cursor__label"></div>
</div>

<!-- ══════════════════════════════════════════ BARRA -->
<header class="qbar" id="qbar">
  <a class="qbar__back" href="./" data-cursor="Home" aria-label="NutriSlim">
    <svg viewBox="0 0 40 64" fill="none" aria-hidden="true">
      <path d="M9 3c0 12 22 15 22 26S9 49 9 61" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M31 3c0 12-22 15-22 26s22 15 22 32" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M13 13h14M9 29h22M13 47h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
    </svg>
  </a>

  <div class="qbar__track" id="qbarTrack" aria-hidden="true"><i id="qbarFill"></i></div>
  <p class="qbar__count"><span id="qStep">OO</span> <span id="qOf">of</span> <span id="qTotal">17</span></p>

  <!-- Mismo selector que el sitio. Las respuestas no se pierden al cambiar
       de idioma: las 17 áreas y los 85 síntomas están en el mismo orden en
       los nueve, así que los índices marcados siguen valiendo. -->
  <div class="lang" id="lang">
    <button class="lang__toggle" id="langToggle" aria-expanded="false" aria-haspopup="true" aria-label="Language">
      <svg class="flag" id="langFlag" aria-hidden="true"><use href="#fl-en"></use></svg>
      <span class="lang__code" id="langCode">EN</span>
      <svg class="lang__chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="lang__menu" id="langMenu" role="menu">
      <button class="lang__opt is-on" data-lang="en" lang="en" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-en"></use></svg>English</button>
      <button class="lang__opt" data-lang="es" lang="es" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-es"></use></svg>Español</button>
      <button class="lang__opt" data-lang="pt" lang="pt" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-pt"></use></svg>Português</button>
      <button class="lang__opt" data-lang="fr" lang="fr" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-fr"></use></svg>Français</button>
      <button class="lang__opt" data-lang="it" lang="it" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-it"></use></svg>Italiano</button>
      <button class="lang__opt" data-lang="de" lang="de" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-de"></use></svg>Deutsch</button>
      <button class="lang__opt" data-lang="ru" lang="ru" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-ru"></use></svg>Русский</button>
      <button class="lang__opt" data-lang="zh-Hant" lang="zh-Hant" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-zh-Hant"></use></svg>繁體中文</button>
      <button class="lang__opt" data-lang="ko" lang="ko" role="menuitem"><svg class="flag" aria-hidden="true"><use href="#fl-ko"></use></svg>한국어</button>
    </div>
  </div>
</header>

<main class="quiz" id="quiz">

  <!-- ── portada ─────────────────────────────────────────── -->
  <section class="qscreen is-on" id="qIntro">
    <div class="qshell">
      <p class="eyebrow" id="iKicker">Free health assessment</p>
      <h1 class="qtitle" id="iTitle">Let's map what your body is telling you.</h1>
      <p class="qlead" id="iLead"></p>
      <p class="qnote" id="iHonest"></p>
      <button class="btn btn--solid qstart" id="qStart" data-cursor="Start"></button>
    </div>
  </section>

  <!-- ── qué silueta ─────────────────────────────────────── -->
  <section class="qscreen" id="qBodyPick">
    <div class="qshell">
      <p class="eyebrow" id="bKicker"></p>
      <h2 class="qtitle" id="bTitle"></h2>
      <p class="qlead" id="bSub"></p>
      <div class="bpick" id="bPick"></div>
    </div>
  </section>

  <!-- ── preguntas (se generan solas) ─────────────────────── -->
  <section class="qscreen" id="qStage">
    <div class="qshell qshell--split">
      <div>
        <svg class="qarea__i" id="qAreaI" viewBox="0 0 24 24" aria-hidden="true"><use href="#a1"></use></svg>
        <p class="qarea__n" id="qAreaN">OO1</p>
        <h2 class="qarea__t" id="qAreaT"></h2>
        <div class="qchips" id="qChips"></div>

        <div class="qnav">
          <button class="btn qback" id="qBack" data-cursor="Back"></button>
          <button class="btn btn--solid qnext" id="qNext" data-cursor="Next"></button>
        </div>
      </div>
      <div class="qbody">
        <div id="bodyA"></div>
        <p class="qbody__l" id="bLegend1"></p>
      </div>
    </div>
  </section>

  <!-- ── resultado ───────────────────────────────────────── -->
  <section class="qscreen" id="qResult">
    <div class="qshell qshell--wide">
      <p class="eyebrow" id="rKicker">Your result</p>

      <div class="rhead">
        <div class="rscore">
          <span class="rscore__n" id="rScore">O</span>
          <span class="rscore__l" id="rScoreL"></span>
        </div>
        <div class="rsay">
          <h2 class="rsay__t" id="rTitle"></h2>
          <p class="rsay__d" id="rText"></p>
        </div>
      </div>

      <div class="rsplit">
        <div>
          <p class="rtop" id="rTopLabel"></p>
          <div class="rbars" id="rBars"></div>
        </div>
        <div class="qbody qbody--res">
          <div id="bodyB"></div>
          <p class="qbody__l" id="bLegend2"></p>
        </div>
      </div>

      <div class="ract">
        <a class="btn btn--solid" id="rCta" href="#" target="_blank" rel="noopener" data-cursor="WhatsApp"></a>
        <button class="btn" id="rAgain" data-cursor="Again"></button>
      </div>
      <p class="rlegal" id="rLegal"></p>
    </div>
  </section>

</main>

<script src="assets/js/quiz.js?v=50"></script>
